[build]
  command = "npm ci && npm ci --prefix frontend && npm run build:frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["drizzle-orm", "postgres"]
  included_files = ["backend/src/**", "db/**"]

[dev]
  command = "npm run dev:frontend"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
